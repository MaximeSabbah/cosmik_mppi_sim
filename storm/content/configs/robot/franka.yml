        # Fingertips: STORM's URDF (franka_panda_no_gripper.urdf) has no separate finger
        # links, so these are rigidly attached to panda_hand like everything else above --
        # the previous spheres stop at z=0.05, leaving the outer ~5cm of the fingers (up to
        # the real rubber gripping pad at z~0.104) with zero collision coverage. Position is
        # the center of the real "rubber tip" collision box from the real robot's URDF
        # (fer_finger_joint origin z=0.0584 + local pad center y=0.00758,z=0.04525), evaluated
        # at the width this robot is actually commanded to (gripper_open_width=0.07m ->
        # 0.035m half-width per finger -- NOT the URDF's absolute mechanical max of 0.04m,
        # which this gripper never actually reaches). Small radius so the sphere stays within
        # the physical fingertip pad, not the whole finger. Static approximation, like every
        # other sphere here -- does not track live gripper width, matches wherever the
        # fingers actually sit while box_collision is active (gripper fully open).
        - "center": [0.0, 0.0426, 0.1036]
          "radius": 0.010
        - "center": [0.0, -0.0426, 0.1036]
          "radius": 0.010
