world_model:
  coll_objs:
    sphere: {}
    cube:
      # floor:
      #   frame: fer_link0
      #   dims: [3.0, 3.0, 0.01] # x, y, z
      #   pose: [0.0, 0.0, -0.05, 0, 0, 0, 1.0] # x, y, z, qx, qy, qz, qw
      table:
        frame: fer_link0
        dims: [1.5, 2.0, 0.05] # large flat surface in x-y
        pose: [0.35, 0.0, -0.025, 0.0, 0.0, 0.0, 1.0] # centered in front of robot, just below z=0
      # Two static poles ("poto_l"/"poto_r"). STORM's world collision only supports sphere/cube
      # primitives (no native cylinder -- see storm_kit/geom/sdf/world.py), so each is a square
      # cross-section box circumscribing a r=3.5cm cylinder (dims.x=dims.y=2*radius=0.07), same
      # approximation the bridge already applies to RViz CYLINDER markers. Span floor (z=-0.05,
      # matching the table's bottom face) up to robot_base+22cm / +24cm.
      poto_l:
        frame: fer_link0
        dims: [0.10, 0.10, 0.30] # 2*0.035 radius x/y, height = -0.05 (floor) to 0.22 (base+22cm)
        pose: [-0.55, -0.43, 0.075, 0.0, 0.0, 0.0, 1.0]
      poto_r:
        frame: fer_link0
        dims: [0.10, 0.10, 0.30] # 2*0.035 radius x/y, height = -0.05 (floor) to 0.24 (base+24cm)
        pose: [-0.55, 0.32, 0.085, 0.0, 0.0, 0.0, 1.0]
